<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM Route Planner - Multi-Route & Region Blocking</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background-color: #f3f4f6; }

    #auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .auth-card { background: #ffffff; padding: 30px; border-radius: 10px; width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .auth-card h2 { margin-bottom: 15px; color: #111827; text-align: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: #374151; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; }

    #sidebar {
      width: 420px; height: 100%; background: #ffffff; padding: 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000;
      display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
    }

    #map { flex: 1; height: 100%; }

    .user-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #e5e7eb; }
    .stop-group { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .stop-group input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; }

    .btn { padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background-color 0.2s; }
    .btn-primary { background-color: #2563eb; color: #ffffff; width: 100%; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-secondary { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .btn-block { background-color: #dc2626; color: #ffffff; width: 100%; }
    .btn-block.active { background-color: #991b1b; }
    .btn-danger { background-color: #ef4444; color: #ffffff; padding: 10px 12px; }
    .auth-toggle { text-align: center; margin-top: 12px; font-size: 0.85rem; color: #2563eb; cursor: pointer; }

    #routes-list { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .route-card { padding: 12px; border: 2px solid #e5e7eb; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; background-color: #fafafa; }
    .route-card.selected { border-color: #2563eb; background-color: #eff6ff; }
    .route-card-title { font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .route-color-indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .route-details { font-size: 0.85rem; color: #4b5563; margin-top: 4px; }
  </style>
  <style>
    :root {
      --ink: #102a43;
      --muted: #627d98;
      --line: #d9e2ec;
      --surface: #ffffff;
      --canvas: #f4f7f9;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --brand-soft: #e6fffb;
      --danger: #c2413b;
      --shadow: 0 14px 35px rgba(16, 42, 67, 0.12);
    }

    * { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--canvas); color: var(--ink); }
    #sidebar { width: 408px; padding: 24px 22px; gap: 16px; border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(16, 42, 67, 0.06); }
    #map { background: #dce8e6; }
    .user-header { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .user-header h3 { color: var(--ink); font-size: 1.08rem; letter-spacing: -0.01em; }
    .user-header span { display: inline-block; margin-top: 5px; color: var(--brand) !important; font-size: .76rem !important; font-weight: 700; }
    .btn { min-height: 42px; padding: 10px 14px; border-radius: 9px; font-size: .86rem; letter-spacing: .01em; }
    .btn-primary { background: var(--brand); box-shadow: 0 5px 12px rgba(15, 118, 110, .18); }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-secondary { background: #f8fafc; color: var(--ink); border-color: var(--line); }
    .btn-secondary:hover { background: #edf6f5; border-color: #9fbfba; }
    .btn-block { background: #fff4f2; color: var(--danger); border: 1px solid #f0c8c3; }
    .btn-block:hover, .btn-block.active { background: var(--danger); color: #fff; }
    .btn-danger { min-height: 40px; background: #fff4f2; color: var(--danger); border: 1px solid #f0c8c3; }
    .stop-group { gap: 9px; margin-bottom: 8px; }
    .stop-group input { min-height: 42px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fbfdfe; }
    .stop-group input:focus, .form-group input:focus { outline: 3px solid rgba(15, 118, 110, .14); border-color: var(--brand); background: #fff; }
    #routes-list { margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
    #routes-list h4 { color: var(--ink); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .route-card { padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 3px 10px rgba(16, 42, 67, .04); }
    .route-card:hover { border-color: #9fbfba; transform: translateY(-1px); }
    .route-card.selected { border: 2px solid var(--brand); background: var(--brand-soft); box-shadow: 0 6px 16px rgba(15, 118, 110, .12); }
    .route-card-title { color: var(--ink); font-size: .88rem; }
    .route-details { color: var(--muted); margin-top: 7px; line-height: 1.5; }
    .route-details strong { color: var(--ink); }
    #auth-overlay { background: rgba(16, 42, 67, .68); backdrop-filter: blur(8px); }
    .auth-card { width: min(390px, calc(100vw - 32px)); padding: 32px; border: 1px solid rgba(255,255,255,.6); border-radius: 16px; box-shadow: var(--shadow); }
    .auth-card h2 { color: var(--ink); font-size: 1.35rem; letter-spacing: -.02em; }
    .auth-card p { color: var(--muted) !important; line-height: 1.5; }
    .form-group label { color: var(--ink); font-size: .78rem; font-weight: 700; letter-spacing: .02em; }
    .form-group input { min-height: 42px; border-color: var(--line); border-radius: 9px; }
    .auth-toggle { color: var(--brand); font-weight: 700; }
    .auth-home-link { display: block; margin-top: 14px; color: var(--muted); font-size: .78rem; font-weight: 700; text-align: center; text-decoration: none; }
    .auth-home-link:hover { color: var(--brand-dark); }
    .leaflet-control-zoom a { color: var(--ink) !important; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .home-link { display: inline-flex; align-items: center; min-height: 34px; padding: 12px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--brand-dark); font-size: .78rem; font-weight: 800; text-decoration: none; }
    .home-link:hover { background: var(--brand-soft); border-color: #a7d8d2; }
    .loading-overlay { position: fixed; z-index: 10000; inset: 0; display: none; place-items: center; background: rgba(16,42,67,.42); backdrop-filter: blur(3px); }
    .loading-overlay.visible { display: grid; }
    .loading-card { display: flex; align-items: center; gap: 12px; min-width: 190px; padding: 15px 18px; border: 1px solid rgba(255,255,255,.8); border-radius: 12px; color: var(--ink); background: #fff; box-shadow: var(--shadow); font-size: .86rem; font-weight: 800; }
    .loading-spinner { width: 20px; height: 20px; border: 3px solid #cce8e4; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice-region { position: fixed; z-index: 10001; top: 18px; right: 18px; display: grid; gap: 10px; width: min(360px, calc(100vw - 36px)); pointer-events: none; }
    .notice { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 13px 12px; border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 10px; color: var(--ink); background: #fff; box-shadow: var(--shadow); font-size: .82rem; line-height: 1.4; pointer-events: auto; animation: notice-in .25s ease both; }
    .notice.warning { border-left-color: #d97706; }
    .notice.error { border-left-color: #c2413b; }
    .notice.success { border-left-color: #16845b; }
    .notice-icon { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; color: #fff; background: var(--brand); font-size: .75rem; font-weight: 900; }
    .notice.warning .notice-icon { background: #d97706; }
    .notice.error .notice-icon { background: #c2413b; }
    .notice.success .notice-icon { background: #16845b; }
    .notice-close { padding: 0 3px; border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 1rem; line-height: 1; }
    .notice-close:hover { color: var(--ink); }
    @keyframes notice-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 800px) { .notice-region { top: 12px; right: 12px; width: min(360px, calc(100vw - 24px)); } }
    @media (max-width: 800px) {
      body { display: flex; flex-direction: column; overflow: auto; }
      #sidebar { width: 100%; height: auto; max-height: 58vh; order: 1; border-right: 0; border-bottom: 1px solid var(--line); }
      #map { flex: none; height: 52vh; min-height: 360px; order: 2; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-card"><span class="loading-spinner" aria-hidden="true"></span><span id="loading-message">Working...</span></div>
  </div>
  <div class="notice-region" id="notice-region" aria-live="polite" aria-atomic="true"></div>

  <div id="auth-overlay">
    <!-- Login Card -->
    <div class="auth-card" id="login-card">
      <h2>Login to Route Planner</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" required placeholder="user@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      <div class="auth-toggle" onclick="toggleAuthMode('register')">Don't have an account? Register</div>
      <a class="auth-home-link" href="home.html">← Back to Home</a>
    </div>

    <!-- Step 1: Registration Initiate -->
    <div class="auth-card" id="register-card" style="display: none;">
      <h2>Create Account</h2>
      <form onsubmit="handleRegisterInitiate(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" required placeholder="Chetan Chhetri" />
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="reg-mobile" required placeholder="+919876543210" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" required placeholder="user@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" required minlength="8" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Send Verification Code</button>
      </form>
      <div class="auth-toggle" onclick="toggleAuthMode('login')">Already registered? Sign In</div>
    </div>

    <!-- Step 2: OTP Verification -->
    <div class="auth-card" id="otp-card" style="display: none;">
      <h2>Verify OTP</h2>
      <p style="font-size: 0.8rem; color: #6b7280; text-align: center; margin-bottom: 12px;">
        A 6-digit code was sent to your email.
      </p>
      <form onsubmit="handleVerifyOTP(event)">
        <div class="form-group">
          <label>6-Digit OTP</label>
          <input type="text" id="otp-code" required maxlength="6" pattern="\d{6}" placeholder="123456" />
        </div>
        <button type="submit" class="btn btn-primary">Verify & Finish Registration</button>
      </form>
    </div>
  </div>

  <div id="sidebar">
    <div class="user-header">
      <div>
        <h3 id="user-display-email">Route Dashboard</h3>
        <span style="font-size: 0.75rem; color: #16a34a;">● Session Authenticated</span>
      </div>
      <div class="header-actions"><a class="home-link" href="home.html">Home</a><button class="btn btn-secondary" onclick="logout()" style="padding: 6px 10px; font-size: 0.8rem;">Logout</button></div>
    </div>

    <div id="stops-container">
      <div class="stop-group">
        <input type="text" class="stop-coords" placeholder="Start (e.g., 26.684812, 88.324585)" />
      </div>
      <div class="stop-group">
        <input type="text" class="stop-coords" placeholder="Destination (e.g., 25.760597, 88.383636)" />
      </div>
    </div>

    <button class="btn btn-secondary" onclick="addStopInput()">+ Add Intermediate Stop</button>
    <button id="block-btn" class="btn btn-block" onclick="toggleBlockMode()">🚫 Draw Blocked Region</button>
    <button class="btn btn-secondary" onclick="clearBlockedRegions()">Clear Blocked Regions</button>
    <button class="btn btn-primary" onclick="calculateRoutes()">Find Routes & Weather</button>

    <div id="routes-list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Dynamic URL targeting current deployed host domain
    const API_BASE_URL = "https://astraroute-1.onrender.com/api/v1";
    let activeToken = localStorage.getItem("jwt_token") || null;
    let pendingEmail = "";
    let map, mapMarkers = [], routeLayers = [], routesData = [], blockedRectangles = [], blockedBoxes = [];
    let isBlockMode = false, blockStartCorner = null;
    const ROUTE_COLORS = ['#2563eb', '#dc2626', '#059669'];

    function setLoading(isLoading, message = 'Working...') {
      document.getElementById('loading-message').textContent = message;
      document.getElementById('loading-overlay').classList.toggle('visible', isLoading);
    }

    function showNotice(message, type = 'warning', duration = 10000) {
      const notice = document.createElement('div');
      const icon = type === 'success' ? '✓' : type === 'error' ? '!' : 'i';
      notice.className = `notice ${type}`;
      const iconNode = document.createElement('span');
      const messageNode = document.createElement('span');
      const closeButton = document.createElement('button');
      iconNode.className = 'notice-icon';
      iconNode.setAttribute('aria-hidden', 'true');
      iconNode.textContent = icon;
      messageNode.textContent = message;
      closeButton.className = 'notice-close';
      closeButton.type = 'button';
      closeButton.setAttribute('aria-label', 'Dismiss notification');
      closeButton.textContent = '×';
      closeButton.addEventListener('click', () => notice.remove());
      notice.append(iconNode, messageNode, closeButton);
      document.getElementById('notice-region').appendChild(notice);
      window.setTimeout(() => notice.remove(), duration);
    }

    window.onload = () => {
      initMap();
      if (activeToken) document.getElementById("auth-overlay").style.display = "none";
    };

    function initMap() {
      map = L.map('map').setView([26.7132, 88.4323], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      map.on('click', (e) => {
        if (isBlockMode) {
          handleBlockClick(e.latlng);
          return;
        }
        const coords = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
        const inputs = document.querySelectorAll('.stop-coords');
        let set = false;
        for (let input of inputs) {
          if (!input.value.trim()) { input.value = coords; set = true; break; }
        }
        if (!set) addStopInput(coords);
      });
    }

    function toggleBlockMode() {
      isBlockMode = !isBlockMode;
      const btn = document.getElementById('block-btn');
      btn.classList.toggle('active', isBlockMode);
      btn.innerText = isBlockMode ? "Click 2 Points on Map to Block Area" : "🚫 Draw Blocked Region";
      blockStartCorner = null;
    }

    function handleBlockClick(latlng) {
      if (!blockStartCorner) {
        blockStartCorner = latlng;
      } else {
        const bounds = L.latLngBounds(blockStartCorner, latlng);
        const rect = L.rectangle(bounds, { color: '#dc2626', weight: 2, fillColor: '#ef4444', fillOpacity: 0.4 }).addTo(map);
        blockedRectangles.push(rect);

        blockedBoxes.push({
          min_lat: Math.min(blockStartCorner.lat, latlng.lat),
          min_lon: Math.min(blockStartCorner.lng, latlng.lng),
          max_lat: Math.max(blockStartCorner.lat, latlng.lat),
          max_lon: Math.max(blockStartCorner.lng, latlng.lng)
        });

        toggleBlockMode();
      }
    }

    function clearBlockedRegions() {
      blockedRectangles.forEach(rect => map.removeLayer(rect));
      blockedRectangles = [];
      blockedBoxes = [];
    }

    function toggleAuthMode(mode) {
      document.getElementById('login-card').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('register-card').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('otp-card').style.display = mode === 'otp' ? 'block' : 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      setLoading(true, 'Signing you in...');
      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Login failed');

        activeToken = data.access_token;
        localStorage.setItem("jwt_token", activeToken);
        document.getElementById("auth-overlay").style.display = "none";
        document.getElementById("user-display-email").innerText = email;
      } catch (err) { showNotice(err.message, 'error'); } finally { setLoading(false); }
    }

    async function handleRegisterInitiate(e) {
      e.preventDefault();
      pendingEmail = document.getElementById("reg-email").value;
      const name = document.getElementById("reg-name").value;
      const mobile_number = document.getElementById("reg-mobile").value;
      const password = document.getElementById("reg-password").value;

      setLoading(true, 'Sending verification code...');
      try {
        const response = await fetch(`${API_BASE_URL}/auth/register/initiate`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, mobile_number, email: pendingEmail, password, is_admin: false })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Registration initiation failed');

        showNotice(data.message, 'success');
        toggleAuthMode('otp');
      } catch (err) { showNotice(err.message, 'error'); } finally { setLoading(false); }
    }

    async function handleVerifyOTP(e) {
      e.preventDefault();
      const otp = document.getElementById("otp-code").value;

      setLoading(true, 'Verifying your account...');
      try {
        const response = await fetch(`${API_BASE_URL}/auth/register/verify`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, otp })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'OTP verification failed');

        showNotice(data.message, 'success');
        toggleAuthMode('login');
        document.getElementById("login-email").value = pendingEmail;
      } catch (err) { showNotice(err.message, 'error'); } finally { setLoading(false); }
    }

    function logout() {
      localStorage.removeItem("jwt_token");
      activeToken = null;
      document.getElementById("auth-overlay").style.display = "flex";
    }

    function addStopInput(value = '') {
      const container = document.getElementById('stops-container');
      const div = document.createElement('div');
      div.className = 'stop-group';
      div.innerHTML = `
        <input type="text" class="stop-coords" placeholder="Intermediate Stop (lat, lon)" value="${value}" />
        <button class="btn btn-danger" onclick="this.parentElement.remove()">✕</button>
      `;
      container.insertBefore(div, container.lastElementChild);
    }

    async function calculateRoutes() {
      if (!activeToken) { showNotice("Please log in.", 'warning'); logout(); return; }

      const inputs = document.querySelectorAll('.stop-coords');
      const coordinates = [];
      inputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          const parts = val.split(',').map(p => parseFloat(p.trim()));
          if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) coordinates.push(parts);
        }
      });

      if (coordinates.length < 2) { showNotice("Please enter at least 2 valid coordinates.", 'warning'); return; }

      const payload = {
        start: { latitude: coordinates[0][0], longitude: coordinates[0][1] },
        end: { latitude: coordinates[coordinates.length - 1][0], longitude: coordinates[coordinates.length - 1][1] },
        waypoints: coordinates.slice(1, -1).map(c => ({ latitude: c[0], longitude: c[1] })),
        avoid_boxes: blockedBoxes,
        round_trip: false
      };

      setLoading(true, 'Finding clear routes...');
      try {
        const response = await fetch(`${API_BASE_URL}/route/optimize`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': `Bearer ${activeToken}` 
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "FastAPI Backend failed");
        }

        if (data.routes && data.routes.length > 0) {
          routesData = data.routes.map((route, idx) => ({
            title: route.title,
            distance: route.total_distance_meters,
            duration: route.total_duration_seconds,
            geometry: route.geometry_geojson,
            color: ROUTE_COLORS[idx] || '#6b7280'
          }));

          renderMultiRoutes(coordinates);
        }
      } catch (err) { 
        showNotice(`Routing Warning: ${err.message}`, 'warning');
      } finally { setLoading(false); }
    }

    function renderMultiRoutes(userCoordinates) {
      routeLayers.forEach(l => map.removeLayer(l));
      mapMarkers.forEach(m => map.removeLayer(m));
      routeLayers = []; mapMarkers = [];

      const container = document.getElementById('routes-list');
      container.innerHTML = '<h4>Available Routes:</h4>';

      routesData.forEach((route, idx) => {
        const isSelected = idx === 0;
        const layer = L.geoJSON(route.geometry, {
          style: { color: route.color, weight: isSelected ? 6 : 4, opacity: isSelected ? 0.9 : 0.4 }
        }).addTo(map);

        routeLayers.push(layer);

        const distKm = (route.distance / 1000).toFixed(2);
        const mins = Math.round(route.duration / 60);

        const card = document.createElement('div');
        card.className = `route-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => selectRoute(idx);
        card.innerHTML = `
          <div class="route-card-title">
            <span class="route-color-indicator" style="background-color: ${route.color}"></span>
            ${route.title}
          </div>
          <div class="route-details">
            Distance: <strong>${distKm} km</strong> | Duration: <strong>${mins} mins</strong>
          </div>
        `;
        container.appendChild(card);
      });

      if (userCoordinates.length >= 2) {
        const startMarker = L.marker([userCoordinates[0][0], userCoordinates[0][1]]).bindPopup("<b>Start Point</b>").addTo(map);
        const endMarker = L.marker([userCoordinates[userCoordinates.length - 1][0], userCoordinates[userCoordinates.length - 1][1]]).bindPopup("<b>Destination</b>").addTo(map);
        mapMarkers.push(startMarker, endMarker);
      }

      if (routeLayers.length > 0) map.fitBounds(routeLayers[0].getBounds(), { padding: [40, 40] });
    }

    function selectRoute(selectedIndex) {
      document.querySelectorAll('.route-card').forEach((card, idx) => {
        card.classList.toggle('selected', idx === selectedIndex);
      });
      routeLayers.forEach((layer, idx) => {
        if (idx === selectedIndex) {
          layer.setStyle({ weight: 6, opacity: 0.9 });
          layer.bringToFront();
        } else {
          layer.setStyle({ weight: 4, opacity: 0.3 });
        }
      });
    }
  </script>
</body>
</html>
