<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM Detailed Trip Planner & Itinerary Builder</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background-color: #f3f4f6; }

    #auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .auth-card { background: #ffffff; padding: 30px; border-radius: 10px; width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .auth-card h2 { margin-bottom: 15px; color: #111827; text-align: center; }

    #sidebar {
      width: 480px; height: 100%; background: #ffffff; padding: 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000;
      display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
    }

    #map { flex: 1; height: 100%; }

    .nav-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
    .nav-header a { font-size: 0.85rem; color: #2563eb; text-decoration: none; font-weight: 600; }

    .section-title { font-size: 0.9rem; font-weight: 700; color: #1f2937; margin-top: 4px; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }

    .form-row { display: flex; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .form-group label { font-size: 0.8rem; color: #374151; font-weight: 600; }
    .form-group input, .form-group select { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.85rem; }

    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #1f2937; cursor: pointer; }

    .btn { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background-color 0.2s; }
    .btn-primary { background-color: #059669; color: #ffffff; width: 100%; }
    .btn-primary:hover { background-color: #047857; }
    .btn-secondary { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .btn-block { background-color: #dc2626; color: #ffffff; width: 100%; }
    .btn-block.active { background-color: #991b1b; }

    .itinerary-day { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; margin-top: 8px; }
    .day-header { font-weight: bold; font-size: 0.85rem; color: #0f172a; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .poi-card { padding: 8px; border: 1px solid #e2e8f0; border-radius: 4px; margin-bottom: 6px; background: #ffffff; }
    .poi-title { font-weight: bold; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    .poi-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: white; }
    .badge-attraction { background-color: #8b5cf6; }
    .badge-hotel { background-color: #3b82f6; }
    .badge-petrol { background-color: #f59e0b; }
    .badge-ev { background-color: #10b981; }
    .badge-restaurant { background-color: #ec4899; }
    .poi-desc { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
  </style>
  <style>
    :root {
      --ink: #102a43;
      --muted: #627d98;
      --line: #d9e2ec;
      --canvas: #f4f7f9;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --brand-soft: #e6fffb;
      --danger: #c2413b;
      --shadow: 0 14px 35px rgba(16, 42, 67, 0.12);
    }

    * { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--canvas); color: var(--ink); }
    #sidebar { width: 448px; padding: 24px 22px; gap: 16px; border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(16, 42, 67, 0.06); }
    #map { background: #dce8e6; }
    .nav-header { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .nav-header h2 { color: var(--ink); font-size: 1.08rem; letter-spacing: -.01em; }
    .nav-header a { color: var(--brand); }
    .section-title { margin-top: 2px; padding: 0 0 8px; border-bottom: 0; color: var(--ink); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; }
    .form-row { gap: 10px; }
    .form-group { gap: 6px; }
    .form-group label { color: var(--ink); font-size: .78rem; font-weight: 700; letter-spacing: .01em; }
    .form-group input, .form-group select { min-height: 42px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fbfdfe; }
    .form-group input:focus, .form-group select:focus { outline: 3px solid rgba(15, 118, 110, .14); border-color: var(--brand); background: #fff; }
    .checkbox-grid { gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fbfdfe; }
    .checkbox-item { min-height: 34px; padding: 5px 6px; border-radius: 7px; color: var(--ink); }
    .checkbox-item:hover { background: var(--brand-soft); }
    .checkbox-item input { accent-color: var(--brand); }
    .btn { min-height: 42px; padding: 10px 14px; border-radius: 9px; font-size: .86rem; letter-spacing: .01em; }
    .btn-primary { background: var(--brand); box-shadow: 0 5px 12px rgba(15, 118, 110, .18); }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-secondary { background: #f8fafc; color: var(--ink); border-color: var(--line); }
    .btn-secondary:hover { background: #edf6f5; border-color: #9fbfba; }
    .btn-block { background: #fff4f2; color: var(--danger); border: 1px solid #f0c8c3; }
    .btn-block:hover, .btn-block.active { background: var(--danger); color: #fff; }
    #trip-summary, #itinerary-list { border-top: 1px solid var(--line); }
    #trip-summary > div { background: var(--brand-soft) !important; border: 1px solid #a7d8d2 !important; border-radius: 10px !important; }
    #trip-summary h4 { color: var(--brand-dark) !important; }
    #trip-summary p { color: var(--brand-dark) !important; line-height: 1.5; }
    #itinerary-list > h4 { color: var(--ink); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; }
    .itinerary-day { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 3px 10px rgba(16, 42, 67, .04); }
    .day-header { color: var(--ink); }
    .day-header span:last-child { color: var(--brand) !important; }
    .poi-card { padding: 10px; border: 1px solid #e6edf2; border-radius: 8px; background: #fbfdfe; }
    .poi-title { color: var(--ink); }
    .poi-desc { color: var(--muted); line-height: 1.45; }
    #auth-overlay { background: rgba(16, 42, 67, .68); backdrop-filter: blur(8px); }
    .auth-card { width: min(390px, calc(100vw - 32px)); padding: 32px; border: 1px solid rgba(255,255,255,.6); border-radius: 16px; box-shadow: var(--shadow); }
    .auth-card h2 { color: var(--ink); font-size: 1.35rem; letter-spacing: -.02em; }
    .auth-card p { color: var(--muted) !important; line-height: 1.5; }
    .leaflet-control-zoom a { color: var(--ink) !important; }
    .nav-header-links { display: flex; align-items: center; gap: 12px; }
    .nav-header-links a { font-size: .78rem; font-weight: 800; text-decoration: none; }
    .nav-header-links .home-link { min-height: 34px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--brand-dark); }
    .nav-header-links .home-link:hover { background: var(--brand-soft); border-color: #a7d8d2; }
    .loading-overlay { position: fixed; z-index: 10000; inset: 0; display: none; place-items: center; background: rgba(16,42,67,.42); backdrop-filter: blur(3px); }
    .loading-overlay.visible { display: grid; }
    .loading-card { display: flex; align-items: center; gap: 12px; min-width: 190px; padding: 15px 18px; border: 1px solid rgba(255,255,255,.8); border-radius: 12px; color: var(--ink); background: #fff; box-shadow: var(--shadow); font-size: .86rem; font-weight: 800; }
    .loading-spinner { width: 20px; height: 20px; border: 3px solid #cce8e4; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice-region { position: fixed; z-index: 10001; top: 18px; right: 18px; display: grid; gap: 10px; width: min(360px, calc(100vw - 36px)); pointer-events: none; }
    .notice { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 13px 12px; border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 10px; color: var(--ink); background: #fff; box-shadow: var(--shadow); font-size: .82rem; line-height: 1.4; pointer-events: auto; animation: notice-in .25s ease both; }
    .notice.warning { border-left-color: #d97706; }
    .notice.error { border-left-color: #c2413b; }
    .notice.success { border-left-color: #16845b; }
    .notice-icon { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; color: #fff; background: var(--brand); font-size: .75rem; font-weight: 900; }
    .notice.warning .notice-icon { background: #d97706; }
    .notice.error .notice-icon { background: #c2413b; }
    .notice.success .notice-icon { background: #16845b; }
    .notice-close { padding: 0 3px; border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 1rem; line-height: 1; }
    .notice-close:hover { color: var(--ink); }
    @keyframes notice-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 800px) { .notice-region { top: 12px; right: 12px; width: min(360px, calc(100vw - 24px)); } }
    @media (max-width: 800px) {
      body { display: flex; flex-direction: column; overflow: auto; }
      #sidebar { width: 100%; height: auto; max-height: 68vh; order: 1; border-right: 0; border-bottom: 1px solid var(--line); }
      #map { flex: none; height: 48vh; min-height: 340px; order: 2; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-card"><span class="loading-spinner" aria-hidden="true"></span><span id="loading-message">Working...</span></div>
  </div>
  <div class="notice-region" id="notice-region" aria-live="polite" aria-atomic="true"></div>

  <!-- AUTH MODAL -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Login Required</h2>
      <p style="font-size:0.85rem; color:#6b7280; margin-bottom:15px; text-align:center;">Log in to use the Custom Trip Planner</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom:10px;">
          <label>Email Address</label>
          <input type="email" id="login-email" required placeholder="user@example.com" />
        </div>
        <div class="form-group" style="margin-bottom:15px;">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <div id="sidebar">
    <div class="nav-header">
      <h2>🗺️ Detailed Trip Planner</h2>
      <div class="nav-header-links">
        <a class="home-link" href="home.html">Home</a>
        <!-- <a href="index.html">← Navigation</a> -->
      </div>
    </div>

    <!-- Step 1: Route Setup -->
    <div class="section-title">1. Route Coordinates</div>
    <div class="form-group">
      <label>Start Location (Lat, Lon)</label>
      <input type="text" id="trip-start" placeholder="Click map or type: 26.7132, 88.4323" />
    </div>
    <div class="form-group">
      <label>Destination (Lat, Lon)</label>
      <input type="text" id="trip-end" placeholder="Click map or type: 28.6139, 77.2090" />
    </div>

    <!-- Step 2: Trip Parameters -->
    <div class="section-title">2. Trip Style & Logistics</div>
    <div class="form-row">
      <div class="form-group">
        <label>Travel Mode</label>
        <select id="sel-mode">
          <option value="driving">🚗 Car / Sedan</option>
          <option value="EV">⚡ Electric Vehicle</option>
          <option value="motorcycle">🏍️ Motorcycle</option>
        </select>
      </div>
      <div class="form-group">
        <label>Trip Pace</label>
        <select id="sel-pace">
          <option value="balanced">Balanced (~8 hrs/day)</option>
          <option value="scenic_detours">Scenic (~6 hrs/day)</option>
          <option value="express">Express (~10 hrs/day)</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Max Detour Distance</label>
        <select id="sel-detour">
          <option value="15">Max 15 km off-route</option>
          <option value="30" selected>Max 30 km off-route</option>
          <option value="50">Max 50 km off-route</option>
        </select>
      </div>
      <div class="form-group">
        <label>Stay Budget</label>
        <select id="sel-budget">
          <option value="budget">Budget / Homestays</option>
          <option value="medium" selected>Medium / 3-Star</option>
          <option value="luxury">Luxury / 5-Star</option>
        </select>
      </div>
    </div>

    <!-- Step 3: POI Filter Checklist -->
    <div class="section-title">3. Services & Attractions Along Route</div>
    <div class="checkbox-grid">
      <label class="checkbox-item"><input type="checkbox" id="chk-petrol" checked /> ⛽ Petrol Pumps</label>
      <label class="checkbox-item"><input type="checkbox" id="chk-ev" /> ⚡ EV Chargers</label>
      <label class="checkbox-item"><input type="checkbox" id="chk-hotels" checked /> 🏨 Hotels / Stays</label>
      <label class="checkbox-item"><input type="checkbox" id="chk-food" checked /> 🍽️ Restaurants</label>
      <label class="checkbox-item"><input type="checkbox" id="chk-heritage" checked /> 🏰 Heritage Sites</label>
      <label class="checkbox-item"><input type="checkbox" id="chk-spiritual" checked /> 🛕 Spiritual / Temples</label>
    </div>

    <!-- Step 4: Region Block Tools -->
    <button id="block-btn" class="btn btn-block" onclick="toggleBlockMode()">🚫 Draw Blocked Region</button>
    <button class="btn btn-secondary" onclick="clearBlockedRegions()">Clear Blocked Regions</button>

    <button class="btn btn-primary" onclick="generateTripPlan()" style="margin-top:4px;">Build Customized Itinerary</button>

    <div id="trip-summary"></div>
    <div id="itinerary-list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_BASE_URL = "https://astraroute-1.onrender.com/api/v1";
    let activeToken = localStorage.getItem("jwt_token") || null;
    let map, routeLayer = null, poiMarkers = [], blockedRectangles = [], blockedBoxes = [];
    let isBlockMode = false, blockStartCorner = null;

    function setLoading(isLoading, message = 'Working...') {
      document.getElementById('loading-message').textContent = message;
      document.getElementById('loading-overlay').classList.toggle('visible', isLoading);
    }

    function showNotice(message, type = 'warning', duration = 4500) {
      const notice = document.createElement('div');
      const icon = type === 'success' ? '✓' : type === 'error' ? '!' : 'i';
      notice.className = `notice ${type}`;
      const iconNode = document.createElement('span');
      const messageNode = document.createElement('span');
      const closeButton = document.createElement('button');
      iconNode.className = 'notice-icon';
      iconNode.setAttribute('aria-hidden', 'true');
      iconNode.textContent = icon;
      messageNode.textContent = message;
      closeButton.className = 'notice-close';
      closeButton.type = 'button';
      closeButton.setAttribute('aria-label', 'Dismiss notification');
      closeButton.textContent = '×';
      closeButton.addEventListener('click', () => notice.remove());
      notice.append(iconNode, messageNode, closeButton);
      document.getElementById('notice-region').appendChild(notice);
      window.setTimeout(() => notice.remove(), duration);
    }

    window.onload = () => {
      initMap();
      if (activeToken) document.getElementById("auth-overlay").style.display = "none";
    };

    function initMap() {
      map = L.map('map').setView([22.5, 82.5], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      map.on('click', (e) => {
        if (isBlockMode) {
          handleBlockClick(e.latlng);
          return;
        }

        const coords = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
        const startInput = document.getElementById("trip-start");
        const endInput = document.getElementById("trip-end");

        if (!startInput.value.trim()) {
          startInput.value = coords;
        } else {
          endInput.value = coords;
        }
      });
    }

    function toggleBlockMode() {
      isBlockMode = !isBlockMode;
      const btn = document.getElementById('block-btn');
      btn.classList.toggle('active', isBlockMode);
      btn.innerText = isBlockMode ? "Click 2 Points on Map to Block Area" : "🚫 Draw Blocked Region";
      blockStartCorner = null;
    }

    function handleBlockClick(latlng) {
      if (!blockStartCorner) {
        blockStartCorner = latlng;
      } else {
        const bounds = L.latLngBounds(blockStartCorner, latlng);
        const rect = L.rectangle(bounds, { color: '#dc2626', weight: 2, fillColor: '#ef4444', fillOpacity: 0.4 }).addTo(map);
        blockedRectangles.push(rect);

        blockedBoxes.push({
          min_lat: Math.min(blockStartCorner.lat, latlng.lat),
          min_lon: Math.min(blockStartCorner.lng, latlng.lng),
          max_lat: Math.max(blockStartCorner.lat, latlng.lat),
          max_lon: Math.max(blockStartCorner.lng, latlng.lng)
        });

        toggleBlockMode();
      }
    }

    function clearBlockedRegions() {
      blockedRectangles.forEach(rect => map.removeLayer(rect));
      blockedRectangles = [];
      blockedBoxes = [];
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      setLoading(true, 'Signing you in...');
      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Login failed');

        activeToken = data.access_token;
        localStorage.setItem("jwt_token", activeToken);
        document.getElementById("auth-overlay").style.display = "none";
      } catch (err) { showNotice(err.message, 'error'); } finally { setLoading(false); }
    }

    async function generateTripPlan() {
      if (!activeToken) {
        document.getElementById("auth-overlay").style.display = "flex";
        return;
      }

      const startInputVal = document.getElementById("trip-start").value.trim();
      const endInputVal = document.getElementById("trip-end").value.trim();

      const startVal = startInputVal.split(",").map(p => parseFloat(p.trim()));
      const endVal = endInputVal.split(",").map(p => parseFloat(p.trim()));

      if (startVal.length !== 2 || endVal.length !== 2 || isNaN(startVal[0]) || isNaN(endVal[0])) {
        showNotice("Please click the map or enter valid Start and End coordinates.", 'warning');
        return;
      }

      // Collect detailed interests
      const interests = [];
      if (document.getElementById("chk-heritage").checked) interests.push("heritage");
      if (document.getElementById("chk-spiritual").checked) interests.push("spiritual");

      const payload = {
        start: { latitude: startVal[0], longitude: startVal[1], name: "Start" },
        end: { latitude: endVal[0], longitude: endVal[1], name: "Destination" },
        preferences: {
          travel_mode: document.getElementById("sel-mode").value,
          trip_pace: document.getElementById("sel-pace").value,
          max_detour_km: parseFloat(document.getElementById("sel-detour").value),
          budget_level: document.getElementById("sel-budget").value,
          interests: interests,
          include_petrol_pumps: document.getElementById("chk-petrol").checked,
          include_ev_chargers: document.getElementById("chk-ev").checked,
          include_hotels: document.getElementById("chk-hotels").checked,
          include_restaurants: document.getElementById("chk-food").checked,
          include_attractions: document.getElementById("chk-heritage").checked || document.getElementById("chk-spiritual").checked
        },
        avoid_boxes: blockedBoxes
      };

      setLoading(true, 'Building your itinerary...');
      try {
        const response = await fetch(`${API_BASE_URL}/trip/plan`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${activeToken}`
          },
          body: JSON.stringify(payload)
        });

        if (response.status === 401) {
          localStorage.removeItem("jwt_token");
          activeToken = null;
          document.getElementById("auth-overlay").style.display = "flex";
          throw new Error("Session expired. Log in again.");
        }

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.detail || "Failed to plan trip");
        }

        const data = await response.json();
        renderTripOnMap(data);

      } catch (err) { showNotice(`Trip Planning Error: ${err.message}`, 'warning'); } finally { setLoading(false); }
    }

    function renderTripOnMap(data) {
      if (routeLayer) map.removeLayer(routeLayer);
      poiMarkers.forEach(m => map.removeLayer(m));
      poiMarkers = [];

      routeLayer = L.geoJSON(data.route_geometry, {
        style: { color: '#059669', weight: 6, opacity: 0.8 }
      }).addTo(map);

      // Summary Header
      document.getElementById("trip-summary").innerHTML = `
        <div style="background:#ecfdf5; padding:12px; border-radius:6px; border:1px solid #a7f3d0; margin-top:10px;">
          <h4 style="color:#065f46;">${data.title}</h4>
          <p style="font-size:0.8rem; color:#047857; margin-top:4px;">
            Distance: <strong>${data.total_distance_km} km</strong> | Drive Time: <strong>${data.total_duration_hours} hrs</strong> | Suggested Span: <strong>${data.suggested_days} Days</strong>
          </p>
        </div>
      `;

      // Itinerary List
      const container = document.getElementById("itinerary-list");
      container.innerHTML = '<h4 style="margin-top:12px;">Day-by-Day Itinerary:</h4>';

      data.itinerary.forEach(daySeg => {
        const dayDiv = document.createElement("div");
        dayDiv.className = "itinerary-day";
        
        let stopsHtml = '';
        if (daySeg.suggested_stops.length === 0) {
          stopsHtml = '<div style="font-size:0.75rem; color:#64748b;">Direct transit day on highway network.</div>';
        } else {
          daySeg.suggested_stops.forEach(poi => {
            let badgeClass = "badge-attraction";
            let iconSymbol = "🏰";
            if (poi.category === "hotel") { badgeClass = "badge-hotel"; iconSymbol = "🏨"; }
            if (poi.category === "petrol_pump") { badgeClass = "badge-petrol"; iconSymbol = "⛽"; }
            if (poi.category === "ev_charger") { badgeClass = "badge-ev"; iconSymbol = "⚡"; }
            if (poi.category === "restaurant") { badgeClass = "badge-restaurant"; iconSymbol = "🍽️"; }

            stopsHtml += `
              <div class="poi-card">
                <div class="poi-title">
                  <span>${iconSymbol} ${poi.name}</span>
                  <span class="poi-badge ${badgeClass}">${poi.category.replace('_', ' ')}</span>
                </div>
                <div class="poi-desc">${poi.description} (Detour: +${poi.detour_distance_km} km)</div>
              </div>
            `;

            // Add Map Marker
            const marker = L.marker([poi.latitude, poi.longitude])
              .bindPopup(`<b>${iconSymbol} ${poi.name}</b><br>${poi.description}<br><small>Detour: +${poi.detour_distance_km} km</small>`)
              .addTo(map);
            poiMarkers.push(marker);
          });
        }

        dayDiv.innerHTML = `
          <div class="day-header">
            <span>${daySeg.title}</span>
            <span style="color:#059669;">${daySeg.suggested_stops.length} Stops</span>
          </div>
          ${stopsHtml}
        `;
        container.appendChild(dayDiv);
      });

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
    }
  </script>
</body>
</html>
